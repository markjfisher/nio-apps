# Paths support shell-style environment expansion (${VAR}) and ~.
# Relative paths are resolved from the nio-apps repository root.

apps:
  - src: ${BOOT_DISK_BIN}/fhost
    name: FHOST
  - src: ${BOOT_DISK_BIN}/fls
    name: FLS
  - src: ${BOOT_DISK_BIN}/fin
    name: FIN
  - src: ${BOOT_DISK_BIN}/fmount
    name: FMOUNT
  - src: ${BOOT_DISK_BIN}/fdrive
    name: FDRIVE
  - src: ${BOOT_DISK_BIN}/fapp
    name: FAPP
  - src: ${BOOT_DISK_BIN}/clock
    name: CLOCK
  - src: ${BOOT_DISK_BIN}/config-nio
    name: CONFNIO
  - src: ${BOOT_DISK_BIN}/keycode
    name: KEYCODE
  - src: bbc/assets/KEYCODE.inf
    name: KEYCODE.inf
  - src: bbc/assets/CNHOSTS
    name: CNHOSTS
  - src: bbc/assets/CNHOSTS.inf
    name: CNHOSTS.inf
  - src: bbc/assets/CNBROW
    name: CNBROW
  - src: bbc/assets/CNBROW.inf
    name: CNBROW.inf
  - src: bbc/assets/CNSLOTS
    name: CNSLOTS
  - src: bbc/assets/CNSLOTS.inf
    name: CNSLOTS.inf
